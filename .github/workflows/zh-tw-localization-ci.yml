name: zh-TW Localization CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/i18n/**'
      - 'src/components/**'
      - 'src/routes/Onboarding/**'
      - 'src/lib/zookeeper/**'
      - '.github/workflows/zh-tw-localization-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  localization-checks:
    name: Localization checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format localization changes in CI workspace
        run: npm run fmt

      - name: Show formatting diff summary
        run: git diff --stat

      - name: Run zh-TW localization unit tests
        run: npx vitest run --mode=development --project=unit src/i18n/index.test.ts

      - name: Prepare Rust toolchain file
        shell: bash
        run: '[ -e rust-toolchain.toml ] || cp rust/rust-toolchain.toml ./'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build KCL Wasm and TypeScript bindings
        run: npm run build:wasm

      - name: TypeScript check
        run: npm run tsc
