name: zh-TW Windows Build

on:
  push:
    branches:
      - feat/zh-TW-localization
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'rust/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - '.github/workflows/zh-tw-windows-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'rust/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - '.github/workflows/zh-tw-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare Rust toolchain file
        shell: pwsh
        run: |
          if (-not (Test-Path rust-toolchain.toml)) {
            Copy-Item rust/rust-toolchain.toml rust-toolchain.toml
          }

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build KCL Wasm
        shell: pwsh
        run: npm run build:wasm:windows

      - name: TypeScript check
        run: npm run tsc

      - name: Package Windows app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run tronb:package:dev

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse out

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Zoo-Design-Studio-zh-TW-Windows
          if-no-files-found: error
          retention-days: 7
          path: |
            out/*universal-win.exe
